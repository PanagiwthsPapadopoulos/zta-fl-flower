# Global Security
simulate_global_leakage: true           # true = The Paper's Method. false = Strict Real-World Security
shap_aware_base_attack: "label_flip"    # Base attack for shap-aware adversaries. Select one from label_flip, gradient_manipulation. If an invalid attack name is inserted, honest training is performed
rollback_threshold: 0.80                # Accuracy threshold. If global accuracy drops below this, weights revert to previous round
tpm_freshness_window: 120               # Expiration Duration for timestamp on TPM emulator in seconds

# Threat Model
# Values represent the proportion of the total edge network assigned to a specific attack.
# The sum of all ratios MUST NOT exceed 1.0. Remaining fraction (1.0 - sum) defaults to Benign nodes.
label_flip_ratio: 0.0                   # Proportion of edge agents that randomly swap true labels
grad_manip_ratio: 0.0                   # Proportion of edge agents that scale up gradients to overpower aggregation
backdoor_ratio: 0.0                     # Proportion of edge agents injecting targeted deterministic patterns
shap_aware_ratio: 0.0                   # Proportion of edge agents that are exploiting the SHAP-aware architecture

# Attack Profiles
# Label Flipping
p_flip: 0.2                          # Probability that a malicious node flips a given label in its batch (1.0 = 100%)
# Gradient Manipulation
gradient_alpha: 0.0                   # Scalar multiplier used to artificially inflate malicious weight updates
# Backdoor
backdoor_poison_fraction: 0.15        # Percentage of the local dataset injected with the BadNet trigger
backdoor_target_class: 0              # The exact integer label the backdoor attempts to force the model to predict
backdoor_trigger_features: "[-3, -2, -1]" # Array string dictating which exact feature indices to modify with the trigger
backdoor_trigger_value: 1.5           # The numerical magnitude injected into the selected trigger features

# Defenses
# ZTA-FL
shap_threshold: 0.5                   # Minimum SHAP stability score (s_i) required to pass the Byzantine filter
shap_val_samples: 100                 # Exact number of samples the Fog uses to evaluate incoming local updates
shap_explain_count: 10                # Number of background samples used for Integrated Gradients baseline approximation

# Robustness
# Honest Mode
benign_adv_ratio: 0.0                 # Percentage of an honest node's training batch replaced with adversarial examples for robustness
benign_eps: 0.05                      # Epsilon budget strictly for the honest robustness training
benign_alpha: 0.2                     # Step size strictly for the honest robustness training
benign_n_iter: 3                      # Iterations strictly for the honest robustness training
# Server Evaluation
robustness_eval_attack: "fgsm"         # String denoting which attack ("pgd" or "fgsm") the Cloud Server uses to benchmark Global Robustness