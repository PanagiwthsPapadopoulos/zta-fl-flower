# Global Security
simulate_global_leakage: false           # true fits transforms on all samples; false fits only the training split
shap_aware_base_attack: "label_flip"    # Poison objective: label_flip = poisoned-label CE; gradient_manipulation = negative clean CE. Invalid names fail.
shap_aware_constrained: true            # false runs the matched unconstrained poisoning control
shap_aware_tau: null                    # REQUIRED positive raw SHAP-distance bound for constrained runs; no paper value is supplied
shap_aware_max_backtracks: 10           # Local solver choice: halve each proposed gradient step at most this many times
rollback_threshold: 0.80                # Roll back at <= this fraction of the previous accepted model accuracy
tpm_freshness_window: 120               # Expiration Duration for timestamp on TPM emulator in seconds

# Threat Model
# Values represent the proportion of the total edge network assigned to a specific attack.
# Their sum AND rounded attacker counts must stay below half the network.
# Remaining nodes are benign; placement does not guarantee an honest majority in each Fog.
label_flip_ratio: 0.0                   # Fraction of all edge nodes assigned the label-flip role
grad_manip_ratio: 0.0                   # Proportion of edge agents that scale up gradients to overpower aggregation
backdoor_ratio: 0.0                     # Proportion of edge agents injecting targeted deterministic patterns
shap_aware_ratio: 0.0                   # Proportion of edge agents that are exploiting the SHAP-aware architecture

# Attack Profiles
# Label Flipping
p_flip: 0.2                          # Per-label replacement probability INSIDE an attacking node, not a node fraction
# Replacement draws from all C classes (including the original): actual-change probability p_flip*(C-1)/C.
# One replacement label set is drawn per local round and reused across that round's epochs.
# Gradient Manipulation
gradient_alpha: 0.0                   # Scalar multiplier used to artificially inflate malicious weight updates
# Backdoor
backdoor_poison_fraction: 0.10        # Percentage of the local dataset injected with the BadNet trigger
backdoor_target_class: 0              # The exact integer label the backdoor attempts to force the model to predict
backdoor_trigger_features: "[-3, -2, -1]" # Array string dictating which exact feature indices to modify with the trigger
backdoor_trigger_value: 1.5           # The numerical magnitude injected into the selected trigger features

# Defenses
# ZTA-FL
shap_val_samples: 100                 # Fog validation/background pool limit; fewer if fewer rows are available
shap_explain_count: 10                # Number of validation samples to explain (the full Fog subset is the background)

# Robustness
# Shared training settings for benign and label-flip nodes (legacy benign_* names).
benign_adv_ratio: 0.0                 # Fraction of each training batch replaced with adversarial examples for robustness
benign_eps: 0.05                      # L-infinity perturbation budget for adversarial training
benign_alpha: 0.2                     # PGD step size for adversarial training
benign_n_iter: 3                      # PGD iteration count for adversarial training
# Single attack selector for adversarial training and robustness evaluation
robustness_eval_attack: "fgsm"         # "fgsm" or "pgd" for training augmentation and robustness evaluation
