[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zta-fl-flower"
version = "1.0.0"
description = "A Flower-based framework for Zero-Trust Agentic Federated Learning in IIoT intrusion detection."
license = { text = "MIT" }
dependencies = [
    "flwr[simulation]>=1.9.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "imbalanced-learn>=0.12.0", 
    "matplotlib>= 3.10.9",
    "pyyaml",
    "torchmetrics>=1.0.0",
    "captum>=0.7.0"
]

[tool.flwr.app]
publisher = "PanagiwthsPapadopoulos"

fab-include = [
    "pyproject.toml",
    "src/**/*.py",
    "config/**/*.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.flwr.app.components]
serverapp = "src.entrypoints.server:app"
clientapp = "src.entrypoints.client:app"

[tool.flwr.app.config]
mode = "deploy"
fog_id = "fog_0"
min_clients = 1
tier = "cloud"


