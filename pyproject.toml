[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zta-fl-flower"
version = "1.0.0"
description = "Automated ZTA-FL Federation Test"
dependencies = [
    "flwr[simulation]>=1.9.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "imbalanced-learn>=0.12.0",  
]

[tool.flwr.app]
publisher = "zta-team"

[tool.flwr.app.components]
serverapp = "src.federation.server:app"
clientapp = "src.federation.client:app"

[tool.flwr.app.config]
# ==============================================================================
# --- 1. CORE EXPERIMENT & TOPOLOGY ---
# ==============================================================================
strategy = "fedprox"
tier = "cloud" 
fog_id = "fog_0" 
dataset = "cic_ids2017"
min-clients = 1
num_fogs = 2
uniform_edges_per_fog = 3
dataset_fraction = 0.05
num_rounds = 2
local_epochs = 2
learning_rate = 0.01
batch_size = 128
quantization_bits = 16

# Attack Ratios
pgd_ratio = 0.09
fgsm_ratio = 0.07
label_flip_ratio = 0.00

# Required Defaults for Auditor
model_architecture = "cnnlstm"
random_seed = 42
clip_min = 0.0
clip_max = 1.0
clip_norm = 1.0
rollback_threshold = 0.80

# ==============================================================================
# --- 7. INFRASTRUCTURE & NETWORKING (EXPLICIT PORTS) ---
# ==============================================================================
broker_ip = "127.0.0.1"
socket_timeout = 3600.0
cloud_sa_port = 9001
cloud_fl_port = 9002
cloud_ctrl_port = 9003
fog_sa_base = 9100
fog_fl_base = 9200
fog_ctrl_base = 9300
fog_client_io_base = 9400
fog_ipc_base = 9500
edge_client_io_base = 10000