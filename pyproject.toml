[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zta-fl-flower"
version = "1.0.0"
description = "A Flower-based framework for Zero-Trust Agentic Federated Learning in IIoT intrusion detection."
license = { text = "MIT" }
dependencies = [
    "flwr[simulation]>=1.9.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "imbalanced-learn>=0.12.0", 
    "matplotlib>= 3.10.9",
    "pyyaml"
]

[tool.flwr.app]
publisher = "PanagiwthsPapadopoulos"
modules = { server = "src.federation.server:app", client = "src.federation.client:app" }

exclude = [
    "data/*",
    "experiments/*",
    "results/*",
    "scripts/*",
    "tests/*",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.flwr.app.components]
serverapp = "src.federation.server:app"
clientapp = "src.federation.client:app"

[tool.flwr.app.config]
# ==============================================================================
# --- 1. CORE EXPERIMENT & TOPOLOGY ---
# ==============================================================================
run_name = ""                             # String identifier for output JSON logs (blank = auto timestamp)
strategy = "zta"                          # Aggregation algorithm (zta, ztafl, fedavg, fedprox, krum, trimmed_mean, flame, fltrust)
tier = "cloud"                            # Operational level of this specific instance ("cloud" or "fog")
fog_id = "fog_0"                          # String identifier for fog instances (ignored if tier is cloud)
num_rounds = 3                            # Total number of global federated communication rounds
min-clients = 1                           # Minimum active connections required to begin a round
num_fogs = 2                              # Total number of intermediary Fog nodes operating in the network
uniform_edges_per_fog = 1                 # If >0, forces each Fog to control exactly this many Edge devices
custom_fog_topology = "[2,1]"                # Array string overriding uniform edges (e.g., "[3, 1]" means Fog0 gets 3, Fog1 gets 1, "[]" uses uniform_edges_per_fog)
simulate_global_leakage = true            # true = The Paper's Method. false = Strict Real-World Security
apply_smote = true                        # Set to true to generate synthetic minority data during training
shap_aware_base_attack = "label_flip"     # Base attack for shap-aware adversaries

# ==============================================================================
# --- 2. DATASET & ML DYNAMICS ---
# ==============================================================================
dataset = "edge_iiotset"                   # Target dataset identifier mapped in data_loader.py
dataset_path = "data/edge_iiotset/raw/network_traffic_samples.csv" # Relative path to the raw dataset file
dataset_fraction = 0.01                   # Proportion of data to load (1.0 = 100%, 0.1 = 10% for fast dev testing)
model_architecture = "cnnlstm"            # Target neural network class mapped in cnn_lstm.py
learning_rate = 0.001                     # Optimizer step size during local training
batch_size = 32                           # Number of samples processed before updating local weights
local_epochs = 3                          # Number of full local dataset passes per federated round
random_seed = 42                          # Master seed for dataset shuffling, partition logic, and role assignment

# Data Skew (Non-IID Settings)
n_classes_per = 3                         # Label Skew: Number of distinct traffic classes each edge agent is allowed to see
power_law_a = 0.4                         # Quantity Skew: Shape of dataset size distribution (0.4 = long tail/heavy skew, 1.0 = uniform)

# Normalization & Gradient Clipping
clip_min = 0.0                            # Lower mathematical bound of scaled features (used to constrain adversarial attacks)
clip_max = 1.0                            # Upper mathematical bound of scaled features (used to constrain adversarial attacks)
clip_norm = 1.0                           # Maximum L2 norm allowed for gradients before clipping (prevents exploding gradients)

# ==============================================================================
# --- 3. DEFENSE & AGGREGATION HYPERPARAMETERS ---
# ==============================================================================
quantization_bits = 32                     # Bit-width for dynamic payload compression (8=INT8, 16=FP16, 32=FP32/Disabled)
rollback_threshold = 0.00                 # Accuracy threshold. If global accuracy drops below this, weights revert to previous round

# ZTA-FL Specific
shap_threshold = 0.5                      # Minimum SHAP stability score (s_i) required to pass the Byzantine filter
shap_val_samples = 100                    # Exact number of samples the Fog uses to evaluate incoming local updates
shap_explain_count = 10                   # Number of background samples used for Integrated Gradients baseline approximation

# Baseline Specific
fedprox_mu = 0.01                         # (FedProx) Proximal penalty term restricting how far local models can drift from global
krum_f = 1                                # (Krum) Expected integer count of Byzantine attackers to bypass during Euclidean selection
trimmed_mean_beta = 0.1                   # (Trimmed Mean) Fraction of extreme weights to discard from top and bottom (0.1 = trim 10%)
flame_target_frac = 0.5                   # (FLAME) Minimum proportion of updates guaranteed to be kept regardless of clustering

# ==============================================================================
# --- 4. MULTI-VECTOR THREAT MODEL (Agent Distributions) ---
# ==============================================================================
# Values represent the proportion of the total edge network assigned to a specific attack.
# The sum of all ratios MUST NOT exceed 1.0. Remaining fraction (1.0 - sum) defaults to Benign nodes.
label_flip_ratio = 0.0                    # Proportion of edge agents that randomly swap true labels
grad_manip_ratio = 0.0                    # Proportion of edge agents that scale up gradients to overpower aggregation
backdoor_ratio = 0.0                      # Proportion of edge agents injecting targeted deterministic patterns
pgd_ratio = 0.0                           # Proportion of edge agents training on iterative PGD adversarial examples
fgsm_ratio = 0.0                          # Proportion of edge agents training on single-step FGSM adversarial examples

# ==============================================================================
# --- 5. ATTACK PROFILES & BUDGETS ---
# ==============================================================================
# Attack 1: Label Flipping
p_flip = 0.0                              # Probability that a malicious node flips a given label in its batch (1.0 = 100%)

# Attack 2: Gradient Manipulation
gradient_alpha = 0.0                      # Scalar multiplier used to artificially inflate malicious weight updates

# Attack 3: Backdoor Poisoning
backdoor_poison_fraction = 0.0            # Percentage of the local dataset injected with the BadNet trigger
backdoor_target_class = 0                 # The exact integer label the backdoor attempts to force the model to predict
backdoor_trigger_features = "[-3, -2, -1]" # Array string dictating which exact feature indices to modify with the trigger
backdoor_trigger_value = 1.5              # The numerical magnitude injected into the selected trigger features

# Attack 4a: PGD Adversarial Evasion
pgd_adv_ratio = 0.0                       # Percentage of a malicious node's batch replaced with PGD examples
pgd_eps = 0.1                             # Maximum allowed perturbation radius (L-infinity budget)
pgd_alpha = 0.01                          # Step size taken in the direction of the gradient per iteration
pgd_n_iter = 7                            # Number of iterative projection steps taken by the PGD algorithm

# Attack 4b: FGSM Adversarial Evasion
fgsm_adv_ratio = 0.0                      # Percentage of a malicious node's batch replaced with FGSM examples
fgsm_eps = 0.2                            # Maximum allowed perturbation radius (L-infinity budget)
fgsm_alpha = 0.02                         # Magnitude of the single gradient step

# ==============================================================================
# --- 6. HONEST NODE ROBUSTNESS & SERVER EVALUATION ---
# ==============================================================================
# Benign Edge Robustness Split (On-Device Adversarial Training)
benign_adv_ratio = 0.3                    # Percentage of an honest node's training batch replaced with adversarial examples for robustness
benign_eps = 0.05                         # Epsilon budget strictly for the honest robustness training
benign_alpha = 0.2                        # Step size strictly for the honest robustness training
benign_n_iter = 3                         # Iterations strictly for the honest robustness training

# Global Server Evaluation
robustness_eval_attack = "pgd"            # String denoting which attack ("pgd" or "fgsm") the Cloud Server uses to benchmark Global Robustness

# ==============================================================================
# --- 7. INFRASTRUCTURE & NETWORKING (EXPLICIT PORTS) ---
# ==============================================================================
broker_ip = "127.0.0.1"                   # Global IP address of the broker routing traffic across the network
socket_timeout = 3600.0                    # Maximum time (seconds) to wait for network IPC responses before throwing a TimeoutError

# Cloud Ports (9000 - 9099)
cloud_sa_port = 9001                      # Flower SuperLink API Port
cloud_fl_port = 9002                      # Flower Fleet API Port
cloud_ctrl_port = 9003                    # Flower ServerApp Execution Port

# Fog Port Bases (Supports up to 99 Fogs safely. e.g., Fog 1 uses 9101, Fog 2 uses 9102)
fog_sa_base = 9100                        # Base port for Fog SuperLink APIs
fog_fl_base = 9200                        # Base port for Fog Fleet APIs
fog_ctrl_base = 9300                      # Base port for Fog ServerApp Execution
fog_client_io_base = 9400                 # Base port for Fog Client Node connections
fog_ipc_base = 9500                       # Base port for the custom ZTA-FL Socket Bridge between Fog and Cloud

# Edge Port Base (10000+) 
edge_client_io_base = 10000               # Base port for Edge Client Node connections (Supports 99 edges per fog)