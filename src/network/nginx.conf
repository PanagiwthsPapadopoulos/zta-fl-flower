worker_processes auto;
pid /Users/panagiwths/Desktop/zta-fl-flower/logs/system/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /Users/panagiwths/Desktop/zta-fl-flower/logs/system/nginx_access.log;
    error_log /Users/panagiwths/Desktop/zta-fl-flower/logs/system/nginx_error.log debug;

    client_max_body_size 50M;
    grpc_read_timeout 1d;
    grpc_send_timeout 1d;

    server {
        listen 9201 ssl;
        http2 on;
        server_name 127.0.0.1 localhost;

        ssl_certificate /Users/panagiwths/Desktop/zta-fl-flower/src/network/certs/fog_1/nginx.crt;
        ssl_certificate_key /Users/panagiwths/Desktop/zta-fl-flower/src/network/certs/fog_1/nginx.key;

        ssl_client_certificate /Users/panagiwths/Desktop/zta-fl-flower/src/network/certs/edge_ca/ca.crt;
        ssl_verify_client on;
        ssl_protocols TLSv1.3;

        location / {
            grpc_pass grpc://127.0.0.1:19201;
        }
    }
    server {
        listen 127.0.0.1:29301;
        http2 on;
        server_name localhost;

        location / {
            grpc_pass grpcs://127.0.0.1:9201;
            
            grpc_ssl_certificate /Users/panagiwths/Desktop/zta-fl-flower/src/network/certs/edge_1_1/client.crt;
